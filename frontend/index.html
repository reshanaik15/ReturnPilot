<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReturnPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "#0f62fe",
              "on-tertiary": "#ffffff",
              "surface-container-low": "#f3f4f6",
              "on-tertiary-fixed-variant": "#653e00",
              outline: "#737687",
              "tertiary-fixed-dim": "#ffb95f",
              primary: "#004ccd",
              "primary-fixed": "#dbe1ff",
              "inverse-primary": "#b4c5ff",
              tertiary: "#7b4d00",
              "on-tertiary-container": "#fff2e7",
              "on-background": "#191c1e",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#9c6300",
              "error-container": "#ffdad6",
              background: "#f8f9fb",
              "inverse-surface": "#2e3132",
              surface: "#f8f9fb",
              "on-secondary-fixed": "#07006c",
              "on-primary": "#ffffff",
              "secondary-container": "#6063ee",
              "surface-container-highest": "#e1e2e4",
              "on-secondary-fixed-variant": "#2f2ebe",
              error: "#ba1a1a",
              "outline-variant": "#c3c6d8",
              "surface-container": "#edeef0",
              "on-tertiary-fixed": "#2a1700",
              "on-surface-variant": "#424656",
              secondary: "#4648d4",
              "surface-tint": "#0052dd",
              "tertiary-fixed": "#ffddb8",
              "secondary-fixed": "#e1e0ff",
              "on-primary-fixed": "#00174c",
              "on-primary-fixed-variant": "#003da9",
              "secondary-fixed-dim": "#c0c1ff",
              "inverse-on-surface": "#f0f1f3",
              "on-error-container": "#93000a",
              "surface-variant": "#e1e2e4",
              "primary-fixed-dim": "#b4c5ff",
              "on-error": "#ffffff",
              "on-secondary-container": "#fffbff",
              "surface-dim": "#d9dadc",
              "surface-bright": "#f8f9fb",
              "on-primary-container": "#f3f3ff",
              "surface-container-high": "#e7e8ea",
              "on-secondary": "#ffffff",
              "on-surface": "#191c1e"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: { "container-max": "1280px", "margin-desktop": "40px", "margin-mobile": "16px", gutter: "24px", unit: "8px" },
            fontFamily: {
              "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"],
              "headline-md": ["Inter"], "display-lg": ["Inter"], "body-lg": ["Inter"],
              "body-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"]
            },
            fontSize: {
              "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "label-md": ["14px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "label-sm": ["12px", { lineHeight: "14px", fontWeight: "500" }]
            }
          }
        }
      };
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #c3c6d8; border-radius: 20px; }
      .chat-area-bg { background: linear-gradient(180deg, #f8f9fb 0%, #ffffff 100%); }
      .typing-indicator span { animation: blink 1.4s infinite both; height: 6px; width: 6px; background: #004ccd; border-radius: 50%; display: inline-block; margin: 0 1px; }
      .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
      .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0% { opacity: 0.2; transform: scale(0.8); } 20% { opacity: 1; transform: scale(1); } 100% { opacity: 0.2; transform: scale(0.8); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
