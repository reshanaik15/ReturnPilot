<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReturnPilot — AI Returns Agent Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .customer-info { display: flex; align-items: center; gap: 12px; }
        .header select { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; padding: 6px 12px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; }
        .header .badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
        .badge-live { background: #065f46; color: #6ee7b7; }

        /* Main layout */
        .main { flex: 1; display: flex; overflow: hidden; }

        /* Chat panel */
        .chat-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .msg-user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .msg-assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
        .msg-system { align-self: center; background: #1e1e3f; border: 1px solid #4338ca; font-size: 12px; color: #a5b4fc; padding: 8px 16px; }
        .msg-assistant strong { color: #60a5fa; }
        .chat-input-area { padding: 16px 20px; border-top: 1px solid #334155; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #475569; color: #e2e8f0; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-family: 'Inter', sans-serif; }
        .chat-input-area input:focus { outline: none; border-color: #3b82f6; }
        .chat-input-area button { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; transition: opacity 0.2s; }
        .chat-input-area button:hover { opacity: 0.9; }
        .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Trace panel */
        .trace-panel { width: 420px; background: #0c1222; display: flex; flex-direction: column; overflow: hidden; }
        .trace-header { padding: 16px; border-bottom: 1px solid #334155; }
        .trace-header h2 { font-size: 14px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .trace-tabs { display: flex; gap: 8px; margin-top: 10px; }
        .trace-tab { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #334155; background: transparent; color: #94a3b8; transition: all 0.2s; }
        .trace-tab.active { background: #1e293b; color: #60a5fa; border-color: #3b82f6; }
        .trace-content { flex: 1; overflow-y: auto; padding: 16px; }

        /* Trace steps */
        .trace-step { margin-bottom: 12px; border-left: 3px solid #475569; padding-left: 14px; }
        .trace-step.agent-nlp { border-left-color: #f472b6; }
        .trace-step.agent-orchestrator { border-left-color: #60a5fa; }
        .trace-step.agent-order { border-left-color: #34d399; }
        .trace-step.agent-policy { border-left-color: #fbbf24; }
        .trace-step.agent-return { border-left-color: #a78bfa; }
        .trace-step.agent-analytics { border-left-color: #fb923c; }
        .trace-step-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .agent-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
        .agent-badge.nlp { background: #4c1d5e; color: #f472b6; }
        .agent-badge.orchestrator { background: #1e3a5f; color: #60a5fa; }
        .agent-badge.order { background: #064e3b; color: #34d399; }
        .agent-badge.policy { background: #451a03; color: #fbbf24; }
        .agent-badge.return { background: #2e1065; color: #a78bfa; }
        .agent-badge.analytics { background: #431407; color: #fb923c; }
        .trace-step-decision { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
        .trace-step-tool { font-size: 12px; color: #64748b; font-family: 'Courier New', monospace; }
        .trace-step-result { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 11px; color: #94a3b8; font-family: 'Courier New', monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .trace-time { font-size: 10px; color: #475569; }

        /* NLP summary card */
        .nlp-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #4338ca; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
        .nlp-card h3 { font-size: 13px; color: #a5b4fc; margin-bottom: 10px; }
        .nlp-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .nlp-label { color: #94a3b8; }
        .nlp-value { color: #e2e8f0; font-weight: 500; }
        .nlp-value.frustrated { color: #f87171; }
        .nlp-value.neutral { color: #fbbf24; }
        .nlp-value.polite { color: #34d399; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .stat-card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; text-align: center; }
        .stat-number { font-size: 20px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }

        /* Loading */
        .loading { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
        .dot-pulse { display: flex; gap: 4px; }
        .dot-pulse span { width: 6px; height: 6px; background: #60a5fa; border-radius: 50%; animation: pulse 1.4s infinite; }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ ReturnPilot</h1>
        <div class="customer-info">
            <span class="badge badge-live">● LIVE</span>
            <select id="customerSelect">
                <option value="7b1e359b-e01a-5a2d-ae0c-5cb09e4a5e84">Amara Chen — amara@demo.dev</option>
                <option value="8bf621ad-b367-56e5-9442-d1c1039b69f4">Jordan Reyes — ethicalerror23@gmail.com</option>
                <option value="7c0028d1-9b02-5498-9b6f-cb94bdb9f0e6">Priya Nair — priya@demo.dev</option>
            </select>
        </div>
    </div>

    <div class="main">
        <!-- Chat Panel -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="msg msg-system">Welcome to ReturnPilot! You're chatting with our AI returns agent. Try: "I want to return the shoes I bought recently"</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Type your return request..." autocomplete="off" />
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Reasoning Trace Panel -->
        <div class="trace-panel">
            <div class="trace-header">
                <h2>🧠 Agent Reasoning Trace</h2>
                <div class="trace-tabs">
                    <div class="trace-tab active" onclick="switchTab('trace', this)">Live Trace</div>
                    <div class="trace-tab" onclick="switchTab('nlp', this)">NLP Analysis</div>
                    <div class="trace-tab" onclick="switchTab('stats', this)">Stats</div>
                </div>
            </div>
            <div class="trace-content" id="traceContent">
                <div style="color: #475569; font-size: 13px; text-align: center; margin-top: 40px;">
                    Send a message to see the multi-agent reasoning trace here
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        let conversationHistory = [];
        let lastNlpAnalysis = null;
        let currentTab = 'trace';
        let totalIterations = 0;
        let totalMessages = 0;

        const AGENT_COLORS = {
            nlp_analyzer: { badge: 'nlp', class: 'agent-nlp', label: 'NLP Analyzer' },
            orchestrator: { badge: 'orchestrator', class: 'agent-orchestrator', label: 'Orchestrator' },
            order_agent: { badge: 'order', class: 'agent-order', label: 'Order Agent' },
            policy_agent: { badge: 'policy', class: 'agent-policy', label: 'Policy Agent' },
            return_agent: { badge: 'return', class: 'agent-return', label: 'Return Agent' },
            analytics_agent: { badge: 'analytics', class: 'agent-analytics', label: 'Analytics Agent' },
        };

        document.getElementById('msgInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message) return;

            const customerId = document.getElementById('customerSelect').value;

            // Show user message
            addChatMessage(message, 'user');
            input.value = '';
            btn.disabled = true;
            btn.textContent = 'Thinking...';

            // Show loading
            const loadingEl = showLoading();

            try {
                const response = await fetch(`${API_BASE}/api/agent/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: customerId,
                        message: message,
                        conversation_history: conversationHistory,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || data.message || 'Agent error');
                }

                // Update conversation history
                conversationHistory.push({ role: 'user', content: [{ type: 'text', text: message }] });
                conversationHistory.push({ role: 'assistant', content: [{ type: 'text', text: data.response }] });

                // Remove loading and show response
                loadingEl.remove();
                addChatMessage(data.response, 'assistant');

                // If return was initiated, show tracker button
                if (data.return_initiated && data.return_id) {
                    addReturnTracker(data.return_id);
                }

                // Update trace panel
                totalIterations += data.iterations || 0;
                totalMessages++;
                renderTrace(data.reasoning_trace);

                // Store NLP data
                if (data.reasoning_trace) {
                    const nlpStep = data.reasoning_trace.find(s => s.agent === 'nlp_analyzer');
                    if (nlpStep && nlpStep.result) lastNlpAnalysis = nlpStep.result;
                }

            } catch (err) {
                loadingEl.remove();
                addChatMessage(`Error: ${err.message}`, 'system');
            }

            btn.disabled = false;
            btn.textContent = 'Send';
        }

        function addChatMessage(text, role) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg msg-${role}`;
            // Basic markdown bold support
            div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addReturnTracker(returnId) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'msg msg-system';
            div.innerHTML = `🎫 Return <strong>${returnId}</strong> created! <button onclick="trackReturn('${returnId}')" style="background:#3b82f6;color:white;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;margin-left:8px;font-size:12px;">Track Return</button>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function trackReturn(returnId) {
            try {
                const res = await fetch(`${API_BASE}/api/returns/${returnId}`);
                const data = await res.json();
                const stages = ['initiated', 'shipped', 'refunded'];
                const currentIdx = stages.indexOf(data.status);
                let tracker = `📦 Return ${returnId} Status:\n`;
                stages.forEach((s, i) => {
                    const label = s === 'shipped' ? 'In Transit' : s.charAt(0).toUpperCase() + s.slice(1);
                    tracker += i <= currentIdx ? `  ✅ ${label}\n` : `  ⬜ ${label}\n`;
                });
                addChatMessage(tracker, 'system');
            } catch (e) {
                addChatMessage(`Could not fetch status: ${e.message}`, 'system');
            }
        }

        function showLoading() {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'loading';
            div.innerHTML = '<div class="dot-pulse"><span></span><span></span><span></span></div><span style="font-size:12px;color:#64748b">Agent reasoning...</span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function renderTrace(trace) {
            if (currentTab !== 'trace') return;
            const container = document.getElementById('traceContent');
            container.innerHTML = '';

            if (!trace || trace.length === 0) {
                container.innerHTML = '<div style="color:#475569;font-size:13px;text-align:center;margin-top:40px">No trace data yet</div>';
                return;
            }

            trace.forEach((step, i) => {
                const agentInfo = AGENT_COLORS[step.agent] || { badge: 'orchestrator', class: 'agent-orchestrator', label: step.agent };
                const div = document.createElement('div');
                div.className = `trace-step ${agentInfo.class}`;

                let html = `<div class="trace-step-header">
                    <span class="agent-badge ${agentInfo.badge}">${agentInfo.label}</span>
                    ${step.tool ? `<span class="trace-step-tool">→ ${step.tool}()</span>` : ''}
                    <span class="trace-time">${step.timestamp ? new Date(step.timestamp).toLocaleTimeString() : ''}</span>
                </div>`;

                if (step.decision) {
                    html += `<div class="trace-step-decision">${step.decision}</div>`;
                }

                if (step.input && Object.keys(step.input).length > 0) {
                    html += `<div class="trace-step-result"><strong>Input:</strong>\n${JSON.stringify(step.input, null, 2)}</div>`;
                }

                if (step.result && step.agent !== 'nlp_analyzer') {
                    const resultStr = JSON.stringify(step.result, null, 2);
                    const truncated = resultStr.length > 500 ? resultStr.slice(0, 500) + '\n...' : resultStr;
                    html += `<div class="trace-step-result"><strong>Result:</strong>\n${truncated}</div>`;
                }

                div.innerHTML = html;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        function renderNlp() {
            const container = document.getElementById('traceContent');
            if (!lastNlpAnalysis) {
                container.innerHTML = '<div style="color:#475569;font-size:13px;text-align:center;margin-top:40px">Send a message to see NLP analysis</div>';
                return;
            }
            const a = lastNlpAnalysis;
            container.innerHTML = `
                <div class="nlp-card">
                    <h3>🔬 NLP Return Analysis</h3>
                    <div class="nlp-row"><span class="nlp-label">Classification</span><span class="nlp-value">${a.reason_classification || 'unknown'}</span></div>
                    <div class="nlp-row"><span class="nlp-label">Confidence</span><span class="nlp-value">${((a.confidence || 0) * 100).toFixed(0)}%</span></div>
                    <div class="nlp-row"><span class="nlp-label">Sentiment</span><span class="nlp-value ${a.sentiment}">${a.sentiment || 'unknown'}</span></div>
                    <div class="nlp-row"><span class="nlp-label">Response Tone</span><span class="nlp-value">${a.suggested_response_tone || 'informative'}</span></div>
                    <div class="nlp-row"><span class="nlp-label">Keywords</span><span class="nlp-value">${(a.keywords || []).join(', ')}</span></div>
                </div>
                <div style="background:#111827;border:1px solid #1f2937;border-radius:8px;padding:12px;font-size:12px;color:#94a3b8;">
                    <strong>Summary:</strong> ${a.brief_summary || 'N/A'}
                </div>
                <div style="margin-top:16px;font-size:12px;color:#475569;">
                    <strong>Why NLP analysis matters:</strong><br>
                    • Automatically categorizes return reasons for business analytics<br>
                    • Detects frustrated customers → adjusts response tone<br>
                    • Powers the analytics dashboard (most returned category, etc.)<br>
                    • No manual tagging needed — AI classifies in real-time
                </div>
            `;
        }

        function renderStats() {
            const container = document.getElementById('traceContent');
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${totalMessages}</div><div class="stat-label">Messages Sent</div></div>
                    <div class="stat-card"><div class="stat-number">${totalIterations}</div><div class="stat-label">Total Iterations</div></div>
                    <div class="stat-card"><div class="stat-number">4</div><div class="stat-label">Specialist Agents</div></div>
                    <div class="stat-card"><div class="stat-number">1</div><div class="stat-label">API (Claude)</div></div>
                </div>
                <div style="background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;font-size:12px;color:#94a3b8;line-height:1.8;">
                    <strong style="color:#60a5fa;">Architecture Explained:</strong><br><br>
                    <strong>Single API, multiple calls:</strong> We use ONE Claude API (Anthropic) called multiple times in a loop. Each call costs ~$0.003-0.01. This is the standard "tool-use" pattern — Claude decides which tool to call, we execute it, feed the result back, and Claude decides the next step.<br><br>
                    <strong>Why "multi-agent"?</strong> Each tool call is labeled as a specialist agent (order_agent, policy_agent, return_agent). The orchestrator routes between them. Judges see distinct decision steps, not a black box.<br><br>
                    <strong>NLP Analyzer:</strong> Uses Claude Haiku ($0.00025/call) — much cheaper — just for classification. It runs in parallel before the main loop, so the orchestrator already knows the customer's sentiment.<br><br>
                    <strong>Cost per return:</strong> ~$0.02-0.05 total (NLP classifier + 3-4 orchestrator iterations). At scale that's pennies per return vs. $5-15 for a human support agent.
                </div>
            `;
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.trace-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if (tab === 'trace') renderTrace(window._lastTrace || []);
            else if (tab === 'nlp') renderNlp();
            else if (tab === 'stats') renderStats();
        }

        // Store last trace for tab switching
        const origRenderTrace = renderTrace;
        renderTrace = function(trace) {
            window._lastTrace = trace;
            if (currentTab === 'trace') origRenderTrace(trace);
        };
    </script>
</body>
</html>
