<body class="h-full flex items-center justify-center bg-surface font-body-md text-body-md text-on-surface antialiased p-margin-mobile md:p-margin-desktop">
<main class="w-full max-w-md">

<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant p-8 md:p-12 text-center">
<!-- Logo area -->

<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center shadow-[0_12px_32px_rgba(0,0,0,0.10)]">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                        assignment_return
                    </span>
</div>
</div>
<!-- Brand & Tagline -->
<h1 class="text-headline-lg font-headline-lg text-primary mb-2">ReturnEase AI</h1>
<p class="text-body-md font-body-md text-on-surface-variant mb-8">
                Your AI-powered assistant for fast and easy product returns.
            </p>
<!-- Form -->
<form action="#" class="space-y-6 text-left" method="POST" id="login-form">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-2" for="account">
                        Select your account to continue
                    </label>
<div class="relative">
<!--
  IMPORTANT: option value = the real customer_id your backend expects
  (POST body: { "customer_id": "...", "message": "..." }).
  cust-003's surname is unconfirmed (handoff only said "Priya") — fix once known.
-->
<select class="block w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-lowest py-3 pl-4 pr-10 text-body-md font-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-4 focus:ring-primary/20 hover:border-outline transition-colors cursor-pointer" id="account" name="account">
<option disabled="" selected="" value="">Choose an account</option>
<option value="cust-001">Amara Chen — amara.chen@example.com</option>
<option value="cust-002">Jordan Reyes — jordan.reyes@example.com</option>
<option value="cust-003">Priya (surname TBD) — priya@example.com</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<p class="mt-2 text-body-sm font-body-sm text-on-surface-variant">
                        Select your account to continue.
                    </p>
</div>
<button class="w-full flex justify-center rounded-lg bg-primary py-3 px-4 text-label-md font-label-md text-on-primary hover:bg-[#003da9] focus:outline-none focus:ring-4 focus:ring-primary/20 transition-colors shadow-sm" type="submit">
                    Continue
                </button>
</form>
</div>
<!-- Footer / Privacy small text -->
<div class="mt-8 text-center">
<p class="text-label-sm font-label-sm text-on-surface-variant">
                Secure, AI-driven return processing.
            </p>
</div>
